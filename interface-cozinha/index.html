<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Painel de pedidos em preparo do Kitchen Flow." />
    <title>Kitchen Flow | Cozinha</title>
 4321'    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="queue-bar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">KF</span>
        <div><strong>Kitchen Flow</strong><span>Painel da cozinha</span></div>
      </div>
      <div class="queue-summary" aria-live="polite">
        <span>Pedidos na fila</span><strong id="queue-count">0</strong>
      </div>
    </header>

    <main>
      <div class="panel-heading">
        <div><span class="eyebrow">EM PREPARO</span><h1>Pedidos da cozinha</h1></div>
        <p id="panel-status" role="status">Carregando pedidos...</p>
      </div>
      <section id="orders-grid" class="orders-grid" aria-label="Pedidos em preparo"></section>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="app.js" defer></script>
  </body>
</html>
